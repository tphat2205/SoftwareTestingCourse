name: EShop API Testing CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'HW06/**'
      - '.github/workflows/api-test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'HW06/**'
      - '.github/workflows/api-test.yml'
  workflow_dispatch:

jobs:
  api-testing:
    name: Run Newman API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: HW06/eshop-sut/backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: HW06/eshop-sut/backend
        run: npm ci

      - name: Start Backend Server
        working-directory: HW06/eshop-sut/backend
        run: |
          node server.js &
          echo "Waiting for backend server to initialize..."
          npx wait-on http://localhost:3000/api/products -t 15000

      - name: Install Newman and HTML Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Execute Postman Collection with Newman
        run: |
          mkdir -p HW06/newman-reports
          newman run HW06/postman/HW06_API_Testing.postman_collection.json \
            -e HW06/postman/EShop_Environment.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export HW06/newman-reports/report.html \
            --reporter-cli-no-failures

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-test-report
          path: HW06/newman-reports/report.html
          retention-days: 14
